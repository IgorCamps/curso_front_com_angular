<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Formulário</h1>

    <form action="formulario-enviado.html" method="post">
      <p>
        <label for="input-rua">Rua:</label>
        <input type="text" id="input-rua" name="rua" required/>
      </p>

      <p>
        <label for="input-numero">Número:</label>
        <input type="number" id="input-numero" name="numero" min="0" max="10" disabled/>
      </p>

      <p>
        <label for="input-email">E-mail:</label>
        <input
          type="email"
          id="input-email"
          name="email"
          placeholder="Seu e-mail"
          value="meu-email@test.com"
          readonly
        />
      </p>


      <p>
        <label for="mensagem">Mensagem</label>
        <textarea name="mensagem" id="mensagem" rows="5"></textarea>
      </p>

      <p>
        <label for="opcoes">Opções</label>
        <select name="opcoes" id="opcoes" multiple>
          <option value="1">Opção 1</option>
          <option value="2">Opção 2</option>
          <option value="3">Opção 3</option>
        </select>
      </p>



      <p>
        <label for="input-tel">Telefone:</label>
        <input
          type="tel"
          id="input-tel"
          name="tel"
          placeholder="(99)99999-9999"
          pattern="\(\d{2}\) \d{5}-\d{4}"
        />
      </p>
      <p>
        <input type="submit" value="Botão de envio" />
        <input type="reset" value="Limpar" />
        <input type="image" src="images/botao.jpg">
      </p>








      <button type="submit">Enviar</button>
      <button type="reset">Limpar</button>
    </form>
  </body>
</html>
