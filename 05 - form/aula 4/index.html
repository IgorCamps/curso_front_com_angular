<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Formulário</h1>

    <form action="formulario-enviado.html" method="post">
      <p>
        <label for="input-data">Data:</label>
        <input type="date" id="input-data" name="data" />
      </p>

      <p>
        <label for="input-data-hora">Data/hora</label>
        <input type="datetime-local" name="data-hora" id="input-data-hora">
      </p>

      <p>
        <label for="input-hora">Hora</label>
        <input type="time" name="hora" id="input-hora">
      </p>

      <p>
        <label for="input-mes">Mês</label>
        <input type="month" name="mes" id="input-mes">
      </p>

      <p>
        <label for="input-semana">Semana</label>
        <input type="week" name="semana" id="input-semana">
      </p>

      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
