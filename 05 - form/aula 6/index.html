<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Formulário</h1>

    <form action="formulario-enviado.html" method="post">
      <p>
        <label for="nao">
          <input id="input-cor" type="color" name="cor" / >
        </label>
      </p>

      <p>
        <label for="input-arquivo">Arquivo</label>
        <input id="input-arquivo" type="file" name="arquivo" accept=".mp3,.mp4" multiple/>
      </p>

      <p>
        <label for="input-range">Range</label>
        <input type="range" name="range" id="input-range" min="0" max="10" step="2">
      </p>

      <p>
        <input type="hidden" name="protocolo" value="000123" />
      </p>
          <button type="submit">Enviar</button>
    </form>
  </body>
</html>
